<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>網路拓樸與資產稽核報告</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f8f9fa; color: #333; }
        .page-container {
            max-width: 297mm; margin: 20px auto; background: white;
            padding: 20mm 15mm; box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .report-header { border-bottom: 3px solid #2c3e50; padding-bottom: 10px; margin-bottom: 20px; }
        .report-header h2 { color: #2c3e50; font-weight: bold; margin: 0; }
        .timestamp { color: #7f8c8d; font-size: 0.9rem; margin-top: 5px; }
        
        .section-title { font-size: 1.2rem; font-weight: bold; color: #2980b9; margin-top: 30px; margin-bottom: 15px; border-left: 4px solid #2980b9; padding-left: 10px; }
        
        /* 💡 圖片自適應設定 */
        #topo-image { width: 100%; max-height: 600px; object-fit: contain; border: 1px solid #dee2e6; border-radius: 5px; margin-bottom: 20px; }
        
        .table th { background-color: #2c3e50 !important; color: white !important; font-size: 0.85rem; padding: 6px; }
        .table td { font-size: 0.8rem; padding: 6px; vertical-align: middle; }
        
        /* 💡 完美解決 PDF 列印被卡斷的問題：改為 A4 橫向 (landscape)，並限制圖片高度 */
        @media print {
            body { background: white; margin: 0; font-size: 9pt; }
            .page-container { box-shadow: none; padding: 0; width: 100%; max-width: none; }
            
            /* A4 橫式列印 */
            @page { size: A4 landscape; margin: 15mm; } 
            
            /* 限制圖片高度，絕對不超頁 */
            #topo-image { max-width: 100%; max-height: 145mm; object-fit: contain; page-break-inside: avoid; border: none; }
            
            .section-title { page-break-after: avoid; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="report-header">
        <h2>網路拓樸與資產稽核報告</h2>
        <div class="timestamp" id="report-time"></div>
    </div>

    <div class="section-title">一、 實體架構拓樸圖 (4K 高畫質擷取)</div>
    <img id="topo-image" src="" alt="拓樸圖生成中...">

    <div class="section-title" style="page-break-before: always;">二、 網路設備資產明細清單</div>
    <table class="table table-bordered table-sm">
        <thead>
            <tr>
                <th width="15%">IP 位址</th>
                <th width="20%">設備名稱</th>
                <th width="15%">廠牌</th>
                <th width="20%">型號</th>
                <th width="10%">層級</th>
                <th width="20%">所在位置</th>
            </tr>
        </thead>
        <tbody id="device-tbody">
            </tbody>
    </table>

    <div class="section-title">三、 實體線路對接紀錄</div>
    <table class="table table-bordered table-sm table-striped">
        <thead>
            <tr>
                <th width="35%">本機端設備 (Port)</th>
                <th width="15%" class="text-center">協定速率</th>
                <th width="50%">遠端對接設備 (Port)</th>
            </tr>
        </thead>
        <tbody id="link-tbody">
            </tbody>
    </table>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var now = new Date();
        document.getElementById('report-time').innerText = "報表生成時間：" + now.toLocaleString('zh-TW', {hour12: false});
        
        var imgData = localStorage.getItem('topo_snapshot');
        if (imgData) {
            document.getElementById('topo-image').src = imgData;
        } else {
            document.getElementById('topo-image').alt = "無法取得圖片，請返回系統重新匯出。";
        }

        fetch('/api/topology/fast?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.nodes) {
                    var dt = document.getElementById('device-tbody');
                    data.nodes.sort((a,b) => a.ip.localeCompare(b.ip)).forEach(n => {
                        dt.innerHTML += `<tr>
                            <td><strong>${n.ip}</strong></td>
                            <td>${n.sysName || ''}</td>
                            <td>${n.brand || ''}</td>
                            <td>${n.model || ''}</td>
                            <td class="text-center">L${n.level || '-'}</td>
                            <td>${n.location || ''}</td>
                        </tr>`;
                    });
                }
                
                if (data.edges) {
                    var lt = document.getElementById('link-tbody');
                    data.edges.forEach(e => {
                        var speedStr = e.speed >= 10000 ? (e.speed/1000)+'G' : (e.speed >= 1000 ? (e.speed/1000)+'G' : e.speed+'M');
                        lt.innerHTML += `<tr>
                            <td>${e.from} <span class="text-secondary">(${e.from_port})</span></td>
                            <td class="text-center fw-bold text-success">${speedStr}</td>
                            <td>${e.to} <span class="text-secondary">(${e.to_port})</span></td>
                        </tr>`;
                    });
                }

                setTimeout(() => { window.print(); }, 800);
            });
    });
</script>
</body>
</html>
